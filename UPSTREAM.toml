# Maps every file of the upstream repo (Claude Code Game Studios) to the file that replaces it here,
# or lists it as ignored with a reason. `python tools/studio.py upstream-diff --coverage` checks that nothing is unaccounted for.
# Reasons start with: claude-only: | other-engine: | ccgs-meta: | replaced: | engine-layer:

