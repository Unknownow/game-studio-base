name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Project checks
        run: python tools/studio.py check
      - name: Unit tests
        run: python -m unittest discover -s tools/gamestudio/tests -t tools -q
